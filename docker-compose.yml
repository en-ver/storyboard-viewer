# Native source development. Prepare the three .dev directories before startup.
# Use an explicit, unique --project-name for this checkout.
services:
  viewer:
    image: storyboard-viewer:dev
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    init: true
    user: '${SBD_UID:-1000}:${SBD_GID:-1000}'
    command: ['serve', '/storyboard.sbd', '--host', '0.0.0.0', '--port', '4400']
    environment:
      NODE_ENV: production
      SBD_CONFIG_DIR: /config
      HOME: /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'
    stop_grace_period: 10s
    ports:
      - '127.0.0.1:${SBD_PORT:-4410}:4400'
    volumes:
      - type: bind
        source: ./.dev/storyboard.sbd
        target: /storyboard.sbd
        bind:
          create_host_path: false
      - type: bind
        source: ./.dev/config
        target: /config
        bind:
          create_host_path: false
      - type: bind
        source: ./.dev/tmp
        target: /tmp
        bind:
          create_host_path: false
