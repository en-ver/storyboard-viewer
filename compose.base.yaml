# Runtime defaults only. Start compose.yaml, not this file.
services:
  viewer:
    image: ${SBD_IMAGE:-storyboard-viewer:local}
    pull_policy: never
    init: true
    user: '${SBD_UID:-1000}:${SBD_GID:-1000}'
    command: ['serve', '/storyboard.sbd', '--host', '0.0.0.0', '--port', '4400']
    environment:
      NODE_ENV: production
      SBD_CONFIG_DIR: /config
      HOME: /tmp
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: 'no'
    stop_grace_period: 10s
    tmpfs:
      - /tmp:size=64m,mode=1777
